server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments are base64 data URLs in JSON bodies, so chart writes can be
    # large. The default 1m would reject a scan upload with a 413.
    client_max_body_size 25m;

    # API calls go to the backend over the compose network. Same browser
    # origin as the app itself, so the session cookie is first-party.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js can hold a request while compiling on a cold start.
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # The app is a single-page client with no router library — every path must
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or the
    # browser keeps serving a stale build after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
