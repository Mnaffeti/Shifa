server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The back office proxies /api to the same backend, exactly as the doctor
    # app's nginx does. It keeps the session cookie first-party on this origin
    # too — a direct cross-origin call to :4000 would make it a third-party
    # cookie, which Safari blocks outright and Chrome/Brave block by default:
    # login would appear to work, then every later call would return 401.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Single-page client with no router library — every path returns index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or the
    # browser keeps serving a stale build after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
